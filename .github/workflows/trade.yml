name: Paper trade (hourly)

on:
  # Hourly runs moved to the always on server (scripts/vm_run.sh via cron at :04, 2026-10-27).
  # GitHub's scheduler skipped most runs, and running both could double up orders.
  workflow_dispatch:           # "Run workflow" button for manual backup runs only

concurrency:
  group: cryptobot-run
  cancel-in-progress: false    # never kill a run mid-order

permissions:
  contents: write              # to commit state/ and docs/ back
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: bars-${{ github.run_id }}
          restore-keys: bars-

      - name: Paper trading cycle
        env:
          ALPACA_API_KEY:     ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cli.py run

      - name: Commit state + dashboard
        if: always()
        run: |
          git config user.name  "cryptobot"
          git config user.email "cryptobot@users.noreply.github.com"
          git add -A state docs
          git diff --cached --quiet || git commit -m "run $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash -X theirs || true   # autostash: the run leaves data/ cache files modified
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
