name: Backtest (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: bars-${{ github.run_id }}
          restore-keys: bars-
      - name: Download history + run backtest
        run: |
          python cli.py fetch
          python cli.py backtest | tee backtest_summary.txt
      - name: Commit results
        run: |
          git config user.name  "cryptobot"
          git config user.email "cryptobot@users.noreply.github.com"
          git add -A docs/backtest.html
          git diff --cached --quiet || git commit -m "backtest $(date -u +'%Y-%m-%d')"
          git pull --rebase || true
          git push
      - name: Summary
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat backtest_summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
