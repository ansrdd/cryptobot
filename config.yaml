# ============================================================
#  CRYPTOBOT CONFIG — the only file you should need to touch
# ============================================================

mode: paper            # paper | live   (live is intentionally NOT implemented — see docs)

account:
  starting_equity: 100000     # paper account starting balance (USD), for P&L tracking

universe:
  symbols: ["BTC/USD", "ETH/USD"]
  timeframe: "1h"             # 1h bars — the whole system is tuned for hourly

data:
  # Where historical bars come from for backtests and warm-up.
  # Downloaded once, then updated incrementally each run.
  source: "binance"           # binance (free, no key, hourly back to 2017) | alpaca
  cache_dir: "data"
  history_start: "2019-01-01" # how far back to backtest. Earlier crypto is a different market.

strategies:
  trend:
    enabled: true
    fast_ema: 20
    slow_ema: 60
    donchian_lookback: 48     # breakout confirmation: price must clear N-bar high
    atr_period: 14
    atr_stop_mult: 3.0        # trailing stop = 3 ATR below highest close since entry
  meanrev:
    enabled: true
    zscore_lookback: 48
    entry_z: -2.0             # buy when price is 2 std below its 48h mean...
    exit_z: 0.0               # ...sell when it reverts to the mean
    trend_filter_ema: 200     # only take longs when price > 200 EMA (don't catch knives)
    atr_period: 14
    atr_stop_mult: 2.0
    max_hold_bars: 72         # time stop: bail after 3 days if it hasn't reverted

regime:
  enabled: true
  adx_period: 14
  trending_above: 25          # ADX > 25 → trending regime
  # capital split per regime (fractions of total risk budget)
  weights:
    trending:  { trend: 0.75, meanrev: 0.25 }
    ranging:   { trend: 0.25, meanrev: 0.75 }

risk:
  risk_per_trade_pct: 0.75    # % of equity risked per trade (distance to stop × size)
  max_position_pct: 25        # no single position > 25% of equity
  max_gross_exposure_pct: 60  # all positions combined ≤ 60% of equity (crypto is correlated)
  max_concurrent_positions: 4
  daily_loss_limit_pct: 3.0   # lose 3% in a day → flatten, sleep until next UTC day
  max_drawdown_kill_pct: 15   # 15% off equity peak → bot disables itself, alerts you
  loss_streak_halve_after: 3  # 3 consecutive losers → half size for next N trades
  loss_streak_halve_for: 5

costs:
  # Pessimistic by design. Alpaca paper fills you perfectly; real life does not.
  taker_fee_bps: 25           # 0.25% — Alpaca crypto is ~0.15–0.25% at low volume
  slippage_bps: 5             # 0.05% assumed slippage per side
  # P&L shown on dashboard is net of these even on paper.

execution:
  order_type: "limit"         # limit | market
  limit_offset_bps: 3         # place limit 3bps through the touch to get filled
  limit_timeout_sec: 300      # cancel unfilled limits after 5 min, re-evaluate next run

backtest:
  walk_forward:
    train_months: 12
    test_months: 3
  benchmark: "BTC/USD"        # buy-and-hold comparison

alerts:
  telegram: true              # needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID secrets
  events: ["kill_switch", "daily_limit", "order_rejected", "run_failed", "stale_data", "weekly_report"]

dashboard:
  output: "docs/index.html"   # GitHub Pages serves /docs
  title: "CryptoBot — Paper"
