# ============================================================
#  DAY TRADING MODE (research) — open clone of the QuantFlow idea
#  Locked BEFORE any backtest. See docs/DAYTRADE_SPEC.md.
#  Do not edit these numbers to make a backtest look better.
#  The live daily bot (config.yaml) is untouched by this file.
# ============================================================

universe:
  symbols: ["BTC/USD", "ETH/USD"]
  timeframe: "5m"              # QuantFlow says it's best on the 5 minute chart
  history_start: "2023-01-01"  # post FTX collapse; ~3.8 years of 5m bars

sources:                       # QuantFlow's five "signal sources", each can be switched on/off
  ribbon_flip:
    enabled: true
    fast_ema: 9
    slow_ema: 21
  macd:
    enabled: true
    fast: 12
    slow: 26
    signal: 9
  rsi2:
    enabled: true
    period: 2
    buy_below: 10              # Connors: buy RSI(2) < 10 ...
    sell_above: 90
    trend_sma: 200             # ... only when price is above its 200 period SMA
  band_reentry:
    enabled: true
    period: 20
    stdev: 2.0
    trend_sma: 200
  gap_fill:
    enabled: false             # crypto trades 24/7 → no session gaps exist to fill

trade:
  atr_period: 14
  stop_atr_mult: 1.5           # initial stop = 1.5 × ATR below entry
  target_r: 2.0                # take profit at 2R (2 × the stop distance)
  breakeven_at_r: 1.0          # once price reaches +1R, stop moves to entry
  exit_on_opposite_signal: true  # "every BUY gets its SELL"
  long_only: true              # Alpaca has no margin for crypto → can't short

filters:
  outsized_candle:
    enabled: true
    range_atr_mult: 3.0        # a bar whose range is > 3 × ATR = a "news candle"
    pause_bars: 18             # pause new entries 90 min (QuantFlow's post news window)

risk:
  risk_per_trade_pct: 1.0
  max_position_pct: 30         # per symbol
  daily_loss_limit_pct: 3.0    # halt new entries for the rest of the UTC day
  max_drawdown_kill_pct: 20    # reported ("would have killed here"), test keeps running

costs:
  # Alpaca crypto Tier 1 taker fee 0.25% + 0.05% slippage, per side (same as main bot)
  fee_bps: 25
  slippage_bps: 5
  diagnostics:                 # NOT the verdict. Only to show how much fees matter.
    maker_no_slip: { fee_bps: 15, slippage_bps: 0 }
    zero_cost: { fee_bps: 0, slippage_bps: 0 }

passing_bar:                   # all must hold, at real costs, full period
  min_sharpe: 0.5
  min_profit_factor: 1.3
  min_total_return_pct: 0.0
  min_trades: 100
  min_pct_quarters_profitable: 60

account:
  starting_equity: 100000
